<script>
  const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
  const mobileSiteNav = document.querySelector('.site-nav');

  if (mobileMenuToggle && mobileSiteNav) {
    mobileMenuToggle.addEventListener('click', () => {
      const isOpen = mobileSiteNav.classList.toggle('is-open');
      mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.querySelectorAll('.header-nav-item').forEach((link) => {
      link.addEventListener('click', () => {
        mobileSiteNav.classList.remove('is-open');
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
</script>

<script>

function moveSlide(direction, sliderSelector = '.portfolio-slider') {
    const slider = document.querySelector(sliderSelector);
    if (!slider) return;
    const scrollAmount = slider.clientWidth;
    slider.scrollBy({
        left: scrollAmount * direction,
        behavior: 'smooth'
    });
}
</script>
