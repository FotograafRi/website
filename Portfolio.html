<script>
  const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
  const mobileSiteNav = document.querySelector('.site-nav');

  if (mobileMenuToggle && mobileSiteNav) {
    mobileMenuToggle.addEventListener('click', () => {
      const isOpen = mobileSiteNav.classList.toggle('is-open');
      mobileMenuToggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.querySelectorAll('.header-nav-item').forEach((link) => {
      link.addEventListener('click', () => {
        mobileSiteNav.classList.remove('is-open');
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
</script>

<script>
  const photoLightbox = document.getElementById('photo-lightbox');
  const photoLightboxImage = photoLightbox.querySelector('.photo-lightbox-image');
  const photoLightboxClose = photoLightbox.querySelector('.photo-lightbox-close');
  const photoLightboxPrevious = photoLightbox.querySelector('.photo-lightbox-prev');
  const photoLightboxNext = photoLightbox.querySelector('.photo-lightbox-next');
  let lightboxImages = [];
  let lightboxIndex = 0;

  document.querySelectorAll('.portfolio-item img').forEach((image) => {
    image.addEventListener('dblclick', () => {
      const slider = image.closest('.portfolio-slider');
      lightboxImages = Array.from(slider.querySelectorAll('.portfolio-item img'));
      lightboxIndex = lightboxImages.indexOf(image);
      showLightboxImage();
      photoLightbox.showModal();
    });
  });

  function showLightboxImage() {
    const image = lightboxImages[lightboxIndex];
    photoLightboxImage.src = image.currentSrc || image.src;
    photoLightboxImage.alt = image.alt;
    const hasMultipleImages = lightboxImages.length > 1;
    photoLightboxPrevious.hidden = !hasMultipleImages;
    photoLightboxNext.hidden = !hasMultipleImages;
  }

  function moveLightboxImage(direction) {
    if (lightboxImages.length < 2) return;
    lightboxIndex = (lightboxIndex + direction + lightboxImages.length) % lightboxImages.length;
    showLightboxImage();
  }

  photoLightboxPrevious.addEventListener('click', () => moveLightboxImage(-1));
  photoLightboxNext.addEventListener('click', () => moveLightboxImage(1));
  photoLightboxClose.addEventListener('click', () => photoLightbox.close());
  photoLightbox.addEventListener('click', (event) => {
    if (event.target === photoLightbox) photoLightbox.close();
  });
  document.addEventListener('keydown', (event) => {
    if (!photoLightbox.open) return;
    if (event.key === 'Escape') photoLightbox.close();
    if (event.key === 'ArrowLeft') moveLightboxImage(-1);
    if (event.key === 'ArrowRight') moveLightboxImage(1);
  });
</script>



<script>

function moveSlide(direction, sliderSelector = '.portfolio-slider') {
    const slider = document.querySelector(sliderSelector);
    if (!slider) return;
    const scrollAmount = slider.clientWidth;
    slider.scrollBy({
        left: scrollAmount * direction,
        behavior: 'smooth'
    });
}

function updatePortfolioButtons(slider) {
    const container = slider.closest('.portfolio-container');
    if (!container) return;

    const previousButton = container.querySelector('.nav-btn.prev');
    const nextButton = container.querySelector('.nav-btn.next');
    const maxScrollLeft = slider.scrollWidth - slider.clientWidth;

    if (previousButton) {
        previousButton.hidden = slider.scrollLeft <= 1;
    }
    if (nextButton) {
        nextButton.hidden = maxScrollLeft <= 1 || slider.scrollLeft >= maxScrollLeft - 1;
    }
}

document.querySelectorAll('.portfolio-slider').forEach((slider) => {
    const updateButton = () => updatePortfolioButtons(slider);
    slider.addEventListener('scroll', updateButton);
    window.addEventListener('resize', updateButton);
    updateButton();
});
</script>
